<!doctype html>
<html lang="{{ session.get('lang','nl') }}">
<head>
  <meta charset="utf-8">
  <title>{{ _('Join group') }} – FairSplit+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://unpkg.com/@picocss/pico@2/css/pico.min.css" rel="stylesheet">
  <style>
    .wrap { max-width: 420px; margin: 3rem auto; }
    h1 { font-weight: 700; }
    button { width: 100%; background: hsl(142,76%,59%); border: none; border-radius: 8px; color: #fff; padding: .7rem; font-weight: 600; }
    button:hover { background: hsl(142,76%,45%); }
  </style>
</head>
<body> 
  <main class="wrap">
    <h1>{{ _('Join group') }}</h1>
    <p>{{ _('Enter the unique code of the group below.') }}</p>

    <form method="POST" action="{{ url_for('main.join_group_form') }}">
      <label for="join_code">{{ _('Group code') }}</label>
      <input type="text" id="join_code" name="join_code" placeholder="{{ _('e.g. A3F9C2') }}" required>
      <button type="submit">{{ _('Join group') }}</button>
    </form>

    <p style="text-align:center; margin-top:1rem;">
      <a href="{{ url_for('main.index') }}">{{ _('Back to dashboard') }}</a>
    </p>
  </main>
</body>
</html>
