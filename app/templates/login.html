{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
<form method="post">
  <label>Email
    <input type="email" name="email" placeholder="jij@voorbeeld.be" required>
  </label>
  <button type="submit">Inloggen</button>
</form>
<p class="muted">
  Nog geen account? <a href="{{ url_for('main.register') }}">Registreer eerst</a>.
</p>
