<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Register – FairSplit+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://unpkg.com/@picocss/pico@2/css/pico.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: hsl(142, 76%, 59%);
      --accent-dark: hsl(142, 76%, 45%);
      --bg: #fff;
      --text: #000;
      --muted: #666;
      font-family: "Inter", sans-serif;
    }
    body { background: var(--bg); color: var(--text); margin: 0; }
    .wrap { max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-weight: 700; margin-bottom: .25rem; }
    p.lead { color: var(--muted); margin-bottom: 1.5rem; }
    .card { border: 1px solid #e5e5e5; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); background: #fff; }
    input { border-radius: 10px; }
    button { border-radius: 10px; background: var(--accent); color: white; font-weight: 600; border: none; padding: .7rem 1.4rem; transition: .2s; width: 100%; }
    button:hover { background: var(--accent-dark); transform: scale(1.02); }
    .error { background: #fff6f6; border: 1px solid #ffcccc; padding: .6rem 1rem; border-radius: 8px; color: #a00; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Register</h1>
    <p class="lead">Maak je FairSplit+ account aan.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="error">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form class="card" method="post" action="{{ url_for('main.register') }}">
      <label for="name">Naam</label>
      <input type="text" id="name" name="name" placeholder="Je naam" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="je@voorbeeld.be" required>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Kies een gebruikersnaam" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="min. 6 tekens" required>

      <button type="submit">Account aanmaken</button>
    </form>

    <p style="text-align:center; margin-top:1rem;">
      Heb je al een account? <a href="{{ url_for('main.login') }}">Log in</a>
    </p>
  </main>
</body>
</html>
