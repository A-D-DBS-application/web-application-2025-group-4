<!doctype html> 
<html lang="en">
<head>  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create group • FairSplit+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>  
    :root { --accent: hsl(142, 76%, 59%); }
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background: #fff; color: #111; }
    .wrap { max-width: 960px; margin: 48px auto; padding: 0 20px; }
    h1 { font-size: 36px; margin: 0 0 16px; }
    .card { background:#fff; border:1px solid #eee; border-radius:16px; padding:24px; box-shadow: 0 8px 28px rgba(0,0,0,0.06); }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
    label { font-weight:600; font-size:14px; display:block; margin:16px 0 6px; }
    input[type="text"], input[type="date"], input[type="number"] {
      width:100%; padding:12px 14px; border:1px solid #e6e6e6; border-radius:12px; font-size:16px;
    }
    .switch { display:flex; align-items:center; gap:10px; margin-top:10px; }
    .btn {
      display:inline-flex; align-items:center; gap:8px; padding:12px 18px; border-radius:12px;
      background: var(--accent); color:#fff; border:none; font-weight:700; cursor:pointer; text-decoration:none;
    }
    .btn.secondary { background:#fff; color:#111; border:1px solid #e8e8e8; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    a { color:#222; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="{{ url_for('main.index') }}">← Back</a>
    </div>

    <h1>Create a group</h1>
    <form class="card" method="post" action="{{ url_for('main.create_group') }}">
      <label>Group name</label>
      <input type="text" name="name" placeholder="Ski weekend" required>

      <div class="row">
        <div>
          <label>Start date</label>
          <input type="date" name="start_date">
        </div>
        <div>
          <label>End date</label>
          <input type="date" name="end_date">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Currency</label>
          <input type="text" name="currency" value="EUR">
        </div>
        <div>
          <label>App fee (optional)</label>
          <input type="number" step="0.01" name="app_fee_amount" placeholder="e.g. 2.00">
        </div>
      </div>

      <label>Invite link (WhatsApp)</label>
      <input type="text" name="invite_link" placeholder="https://chat.whatsapp.com/...">

      <label class="switch">
        <input type="checkbox" name="auto_close_on_end" checked>
        <span>Auto-close balances at end date</span>
      </label>

      <div style="margin-top:20px;">
        <button class="btn" type="submit">Create group</button>
        <a class="btn secondary" href="{{ url_for('main.index') }}">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
