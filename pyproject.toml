[tool.poetry]
name = "web-application-2025-group-4"
version = "0.1.0"
description = "Webapplicatie voor groep 4, klaar voor Render deploy"
authors = ["Margaux Maertens [margaux.maertens@ugent.be](mailto:margaux.maertens@ugent.be)"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
flask = "^2.3.3"
gunicorn = "^20.1.0"
requests = "^2.32.0"
sqlalchemy = "^2.0.20"
python-dotenv = "^1.0.0"
jinja2 = "^3.1.2"
flask-babel = "^3.1.0"
supabase = "^2.24.0"
openai = "^1.0.0"
qrcode = {extras = ["pil"], version = "^8.2"}
reportlab = "^4.4.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
isort = "^6.0.0"
 

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
