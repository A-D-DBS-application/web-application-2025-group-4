[tool.poetry]
name = "web-application-2025-group-4"
version = "0.1.0"
description = "Webapplicatie voor groep 4, klaar voor Render deploy"
authors = ["Margaux Maertens [margaux.maertens@ugent.be](mailto:margaux.maertens@ugent.be)"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.26.0"
gunicorn = "^22.1.0"
requests = "^2.32.0"
sqlalchemy = "^2.0.20"
python-dotenv = "^1.0.0"
jinja2 = "^3.1.2"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
isort = "^6.0.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
